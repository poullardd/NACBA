<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NACBA Email Generator</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f4f4; margin: 0; padding: 16px; color: #222; }
  .container { display: flex; gap: 20px; max-width: 1200px; margin: auto; align-items: flex-start; }
  .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
  .form-panel { width: 40%; }
  .preview-panel { width: 60%; }
  h2 { color: #005596; margin: 0 0 12px; font-size: 20px; }
  label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
  .hint { font-weight: normal; color: #777; }
  input[type=text], input[type=url], input[type=date], select, textarea { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #fff; font-family: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #005596; border-color: #005596; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .check input { width: auto; margin: 0; }
  .check label { margin: 0; font-size: 13px; }
  button { padding: 11px 15px; background: #005596; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
  button:hover { background: #003d70; }
  button.secondary { background: #fff; color: #005596; border: 1px solid #005596; }
  button.secondary:hover { background: #eef5fb; }
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .actions button { flex: 1; min-width: 140px; }
  .meta-box { background: #f4f8fc; border: 1px solid #cfe0ef; border-radius: 4px; padding: 10px 12px; margin-bottom: 14px; }
  .meta-box .k { font-size: 11px; font-weight: bold; color: #005596; text-transform: uppercase; letter-spacing: .5px; display: block; margin-top: 6px; }
  .meta-box .k:first-child { margin-top: 0; }
  .meta-box .v { font-size: 14px; word-break: break-word; }
  #emailPreview { border: 1px solid #ddd; padding: 20px; border-radius: 4px; background: #fff; overflow-x: auto; }
  #status { min-height: 20px; margin-top: 10px; font-size: 13px; color: #1a7f37; font-weight: bold; }
  .warn { color: #b3261e; font-size: 12px; margin-top: 4px; }
  @media (max-width: 820px) {
    .container { flex-direction: column; }
    .form-panel, .preview-panel { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- FORM -->
  <div class="panel form-panel">
    <h2>NACBA Email Generator</h2>

    <label for="template">Email type</label>
    <select id="template">
      <optgroup label="Webinars">
        <option value="panelistInvite">Panelist access (day before)</option>
        <option value="panelistDayOf">Panelist reminder (day of)</option>
        <option value="attendeeReminder">Attendee same-day email (access info)</option>
        <option value="recording">Recording &amp; materials (post-webinar)</option>
        <option value="analytics">Post-webinar analytics (to staff)</option>
      </optgroup>
      <optgroup label="Membership &amp; referrals">
        <option value="renewal">Membership renewal reminder</option>
        <option value="referral">Attorney referral</option>
      </optgroup>
    </select>

    <div id="f-title">
      <label for="webinarTitle">Webinar title</label>
      <input type="text" id="webinarTitle" placeholder="e.g., Student Loan Adversary Proceedings in a Nutshell">
    </div>

    <div id="f-speakers">
      <label for="speakers">Speaker name(s)</label>
      <input type="text" id="speakers" placeholder="e.g., Judge Reyes Bordeaux, Elan Levey, and Jenny Doling">
    </div>

    <div id="f-greeting">
      <label for="greeting">Greeting</label>
      <select id="greeting">
        <option>Good morning</option>
        <option>Good afternoon</option>
        <option>Hello</option>
      </select>
    </div>

    <div id="f-short">
      <label for="shortName">Short name <span class="hint">(subject line)</span></label>
      <input type="text" id="shortName" placeholder="e.g., SLAP in a Nutshell">
    </div>

    <div id="f-date">
      <label for="dateVal">Webinar date</label>
      <input type="date" id="dateVal">
    </div>

    <div id="f-name">
      <label for="name">Panelist first name(s)</label>
      <input type="text" id="name" placeholder="e.g., Stanley  or  Stanley and Alyssa" autocomplete="off">
      <div class="check"><input type="checkbox" id="both"><label for="both">More than one panelist ("Thank you both")</label></div>
    </div>

    <div id="f-link">
      <label for="link" id="linkLabel">Zoom panelist link</label>
      <input type="url" id="link" placeholder="https://zoom.us/..." autocomplete="off">
      <div class="warn" id="linkWarn" hidden>Link should start with https://</div>
    </div>

    <div class="row">
      <div id="f-practice">
        <label for="practice">Practice time (ET)</label>
        <input type="text" id="practice" placeholder="e.g., 2:40 PM">
      </div>
      <div id="f-live">
        <label for="live">Live start (ET)</label>
        <input type="text" id="live" placeholder="e.g., 3:00 PM">
      </div>
    </div>

    <div id="f-livePT">
      <label for="livePT">Live start (PT)</label>
      <input type="text" id="livePT" placeholder="e.g., 12:00 PM">
    </div>

    <div id="f-dropbox">
      <label for="dropbox">Dropbox folder link</label>
      <input type="url" id="dropbox" placeholder="https://www.dropbox.com/..." autocomplete="off">
    </div>
    <div id="f-survey">
      <label for="survey">Survey link <span class="hint">(clear to omit)</span></label>
      <input type="url" id="survey" value="https://www.surveymonkey.com/r/ST8YQML" autocomplete="off">
    </div>
    <div id="f-cle">
      <label for="cle">CLE note</label>
      <select id="cle">
        <option value="no">NACBA does not provide CLE for this webinar</option>
        <option value="none">Leave CLE note out</option>
      </select>
    </div>

    <div id="f-stats">
      <label>Webinar analytics</label>
      <div class="row">
        <div><input type="text" id="signups" placeholder="Total signups" inputmode="numeric"></div>
        <div><input type="text" id="liveAtt" placeholder="Live attendance" inputmode="numeric"></div>
      </div>
      <div class="row">
        <div><input type="text" id="onDemand" placeholder="On-demand / watch later" inputmode="numeric"></div>
        <div><input type="text" id="revenue" placeholder="Revenue, e.g. $4,770"></div>
      </div>
      <div class="row">
        <div><input type="text" id="members" placeholder="Members" inputmode="numeric"></div>
        <div><input type="text" id="nonMembers" placeholder="Non-members" inputmode="numeric"></div>
      </div>
    </div>
    <div id="f-highlights">
      <label for="highlights">Highlights paragraph</label>
      <textarea id="highlights">The engagement was fantastic, and we are already receiving great feedback on the sample forms and pleadings provided by [speaker names]. It is also great to see so many registrants using the on-demand recordings for professional development.</textarea>
    </div>

    <label for="logoPos">NACBA logo</label>
    <select id="logoPos">
      <option value="top">Top of email</option>
      <option value="sig">Above signature</option>
      <option value="none">No logo</option>
    </select>

    <div class="actions">
      <button id="copyBtn">Copy email</button>
      <button id="copySubjectBtn" class="secondary">Copy subject</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <!-- PREVIEW -->
  <div class="panel preview-panel">
    <h2>Live Preview</h2>
    <div class="meta-box">
      <span class="k">Subject</span><span class="v" id="subjectLine"></span>
      <div id="recipBox" hidden><span class="k">Recipients</span><span class="v" id="recipLine"></span></div>
    </div>
    <div id="emailPreview"></div>
  </div>
</div>

  var $ = function (id) { return document.getElementById(id); };

  var ALL = ['title', 'speakers', 'greeting', 'livePT', 'short', 'date', 'name', 'link', 'practice', 'live', 'dropbox', 'survey', 'cle', 'stats', 'highlights'];
  var CONFIG = {
    panelistInvite:   { show: ['date', 'name', 'link', 'practice', 'live'], linkLabel: 'Zoom panelist link' },
    panelistDayOf:    { show: ['date', 'name', 'link', 'practice', 'live'], linkLabel: 'Zoom panelist link' },
    attendeeReminder: { show: ['title', 'speakers', 'date', 'live', 'livePT', 'greeting'], linkLabel: '' },
    recording:        { show: ['title', 'date', 'dropbox', 'survey', 'cle'], linkLabel: '' },
    analytics:        { show: ['title', 'short', 'date', 'stats', 'highlights'], linkLabel: '' },
    renewal:          { show: [], linkLabel: '' },
    referral:         { show: [], linkLabel: '' }
  };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function val(id) { return $(id).value.trim(); }
  function ph(text) { return '<span style="background:#fff3cd;padding:0 3px;">[' + esc(text) + ']</span>'; }
  function field(id, placeholder) { var v = val(id); return v ? '<strong>' + esc(v) + '</strong>' : ph(placeholder); }
  function plain(id, placeholder) { var v = val(id); return v ? esc(v) : ph(placeholder); }
  function isUrl(u) { return /^https?:\/\//i.test(u); }
  function safeUrl(u) { return isUrl(u) ? esc(u) : '#'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // ---- Dates ----
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function getDate() {
    var v = val('dateVal'); if (!v) return null;
    var p = v.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function longDate(d) { return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function fullDate(d) { return MONTHS[d.getMonth()] + ' ' + pad(d.getDate()) + ', ' + d.getFullYear(); }
  function numDate4(d) { return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '.' + d.getFullYear(); }
  function numDate2(d) { return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '.' + String(d.getFullYear()).slice(-2); }
  function dayDiff(d) {
    var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((d - t) / 86400000);
  }
  function when() {
    var d = getDate();
    if (!d) return { poss: ph('Date') + "'s", on: 'on ' + ph('Date') };
    var diff = dayDiff(d);
    if (diff === 1) return { poss: "tomorrow's", on: 'tomorrow' };
    if (diff === 0) return { poss: "today's", on: 'today' };
    return { poss: 'the ' + esc(longDate(d)), on: 'on ' + esc(longDate(d)) };
  }
  function whenPast() {
    var d = getDate();
    if (!d) return ph('date');
    var diff = dayDiff(d);
    if (diff === 0) return 'today';
    if (diff === -1) return 'yesterday';
    if (diff < -1 && diff >= -7) return 'this past ' + DAYS[d.getDay()];
    return 'on ' + esc(longDate(d));
  }

  function button(label, url) {
    return '<p style="margin:20px 0;"><a href="' + safeUrl(url) + '" style="display:inline-block;background-color:' + BLUE +
      ';color:#ffffff;text-decoration:none;padding:12px 25px;border-radius:4px;font-weight:bold;font-family:Arial,Helvetica,sans-serif;">' +
      esc(label) + '</a></p>';
  }
  function callout(title, items) {
    var lis = items.map(function (t, i) {
      return '<li style="margin-bottom:' + (i === items.length - 1 ? '0' : '10px') + ';">' + t + '</li>';
    }).join('');
    return '<div style="background-color:#f9f9f9;border-left:4px solid ' + BLUE + ';padding:15px;margin:20px 0;">' +
      '<p style="margin:0 0 8px;font-weight:bold;color:' + BLUE + ';">' + esc(title) + '</p>' +
      '<ul style="margin:0;padding-left:20px;">' + lis + '</ul></div>';
  }
  function logoImg(w, mb) {
    return '<img src="' + LOGO + '" alt="National Association of Consumer Bankruptcy Attorneys" width="' + w + '" style="display:block;width:' + w + 'px;max-width:100%;height:auto;border:0;margin:0 0 ' + mb + 'px;">';
  }

    return '<p style="margin:0;">' + closing + '</p>' +
      '<div style="margin-top:18px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#333333;line-height:1.5;">' +
      (pos === 'sig' ? logoImg(200, 10) : '') +
      '<div style="font-size:17px;font-weight:bold;color:' + NAVY + ';">Deidre Durant</div>' +
      '<div style="font-weight:bold;color:#333333;">Director of Operations</div>' +
      '<div style="margin-top:12px;">National Association of Consumer Bankruptcy Attorneys</div>' +
      '<div><a href="tel:8004999040" style="' + link + '">(800) 499-9040</a> &nbsp;|&nbsp; ' +
      '<a href="mailto:deidre.durant@nacba.com" style="' + link + 'text-decoration:none;">deidre.durant@nacba.com</a> &nbsp;|&nbsp; ' +
      '<a href="https://www.NACBA.org" style="' + link + 'text-decoration:none;">www.NACBA.org</a></div>' +
      '<div style="margin-top:12px;font-weight:bold;font-style:italic;">Educate, Advocate, Litigate!</div>' +
      '<div><a href="http://www.nacba.org/" style="' + link + 'text-decoration:none;">NACBA</a> is the only national organization dedicated to serving the needs of consumer bankruptcy attorneys and protecting the rights of consumer debtors in bankruptcy.</div>' +
      '</div>';
  }
  function wrap(inner, closing) {
    var pos = $('logoPos').value;
    return '<div style="font-family:Arial,Helvetica,sans-serif;color:#333333;line-height:1.6;max-width:640px;font-size:15px;">' +
      (pos === 'top' ? logoImg(240, 22) : '') + inner + signature(closing) + '</div>';
  }

  // ---- Templates ----
  var BUILDERS = {
    panelistInvite: function () {
      var d = getDate(), w = when();
      var thanks = $('both').checked ? 'Thank you both for joining us for ' : 'Thank you for joining us for ';
      var body =
        '<p>Hi ' + field('name', 'First Name') + ',</p>' +
        '<p>' + thanks + w.poss + ' NACBA webinar. We are looking forward to a great session.</p>' +
        '<p>Please use the panelist link below to join the webinar. This link is unique to you as a panelist and will allow you to share your screen and present.</p>' +
        button('Zoom Panelist Link', val('link')) +
        callout('A few quick notes:', [
          'Please join by ' + field('practice', 'Practice Time') + ' ET for our practice session so we can test audio, video, and screen sharing before we go live at ' + field('live', 'Live Time') + ' ET.',
          'Attendees will submit questions through the Q&amp;A box; I will monitor and pass questions to you during the session.',
          'The webinar will be recorded automatically.'
        ]) +
        '<p>Please reach out if you have any questions before ' + (d && dayDiff(d) === 1 ? 'tomorrow' : 'then') + '. I look forward to connecting with you at ' + field('practice', 'Practice Time') + ' ET.</p>';
      return { subject: 'NACBA Webinar - Panelist Access | ' + (d ? numDate4(d) : '[Date]'), html: wrap(body, 'Best regards,') };
    },

    panelistDayOf: function () {
      var d = getDate();
      var body =
        '<p>Hi ' + field('name', 'First Name') + ',</p>' +
        '<p>A quick reminder that today\'s NACBA webinar goes live at ' + field('live', 'Live Time') + ' ET. ' +
        'Please join the practice session at ' + field('practice', 'Practice Time') + ' ET so we can check audio, video, and screen sharing.</p>' +
        button('Zoom Panelist Link', val('link')) +
        callout('Reminders:', [
          'Attendees will submit questions through the Q&amp;A box; I will monitor and pass questions to you during the session.',
          'The webinar will be recorded automatically.'
        ]) +
        '<p>I look forward to connecting with you at ' + field('practice', 'Practice Time') + ' ET.</p>';
      return { subject: 'NACBA Webinar - Panelist Reminder | ' + (d ? numDate4(d) : '[Date]'), html: wrap(body, 'Best regards,') };
    },

    attendeeReminder: function () {
      var t = val('webinarTitle'), d = getDate();
      var next = d ? DAYS[(d.getDay() + 1) % 7] : null;
      var nextTxt = next ? esc(next) : ph('next day');
      var dateTxt = d ? esc(longDate(d)) : ph('Date');
      var timeTxt = (val('livePT') ? esc(val('livePT')) + ' PT' : ph('PT time')) + ' / ' + (val('live') ? esc(val('live')) + ' ET' : ph('ET time'));
      var details = callout('Webinar Details:', [
        '<strong>Date:</strong> ' + dateTxt,
        '<strong>Time:</strong> ' + timeTxt,
        '<strong>Your Access Link:</strong> You will receive a direct email from Zoom containing your unique link to join the webinar. Please use the link in that Zoom email to access the live session.',
        '<strong>Materials, Recording, &amp; Certificate of Attendance:</strong> To streamline your experience, all presentation materials, the self-study Certificate of Attendance, and the webinar recording will be finalized and emailed to you by EOD ' + nextTxt + '.'
      ]);
      var body =
        '<p>' + esc($('greeting').value) + ',</p>' +
        '<p>We look forward to having you join us today for <strong>' + (t ? esc(t) : ph('Webinar Title')) + '</strong>' +
        (val('speakers') ? ' with ' + esc(val('speakers')) : ' with ' + ph('Speaker Names')) + '.</p>' +
        details +
        '<p><strong>Please note:</strong> NACBA does not report CLE credits directly. You may use the provided Certificate of Attendance on ' + nextTxt + ' to self-submit for self-study credit with your state bar.</p>' +
        '<p>We will see you today at ' + field('live', 'ET time') + ' ET!</p>';
      return { subject: 'Your Access Link: ' + (t || '[Webinar Title]'), html: wrap(body, 'Best regards,') };
    },

    recording: function () {
      var t = val('webinarTitle'), d = getDate();
      var cle = $('cle').value === 'no' ? ' <em>(Note: NACBA does not provide CLE for this webinar).</em>' : '';
      var survey = val('survey');
      var body =
        '<p>Hello,</p>' +
        '<p>Thank you for participating in NACBA\'s Webinar, ' + (t ? esc(t) : ph('Webinar Title')) + ', presented on ' + (d ? esc(fullDate(d)) : ph('Date')) + '.</p>' +
        '<p style="margin-bottom:0;"><strong>Webinar Materials &amp; Recording</strong><br>' +
        'Below is the link to download the webinar materials, including a Certificate of Attendance that you may submit to your appropriate MCLE Board, as well as the full webinar recording.' + cle + '</p>' +
        button('Access Materials & Recording', val('dropbox')) +
        (survey
          ? '<p style="margin-bottom:0;"><strong>We want your feedback!</strong> To help us continue providing the best educational programming, please take a quick moment to fill out our post-webinar survey.</p>' +
            button('Take the Survey', survey)
          : '') +
        '<p>Please email <a href="mailto:admin@nacba.com" style="color:' + LINK + ';">admin@nacba.com</a> directly if you have any trouble accessing the materials.</p>';
      return { subject: 'NACBA Webinar Recording & Materials: ' + (t || '[Webinar Title]') + ' (' + (d ? numDate2(d) : '[Date]') + ')', html: wrap(body, 'Thank you,') };
    },

    analytics: function () {
      var t = val('webinarTitle'), s = val('shortName'), d = getDate();
      var m = parseInt(val('members'), 10), n = parseInt(val('nonMembers'), 10);
      var split;
      if (!isNaN(m) && !isNaN(n) && m + n > 0) {
        var pm = Math.round(m / (m + n) * 100);
        split = '<strong>' + m + '</strong> Members (' + pm + '%) / <strong>' + n + '</strong> Non-Members (' + (100 - pm) + '%)';
      } else { split = ph('Members / Non-Members'); }
      function row(label, value, last) {
        return '<tr><td style="padding:9px 12px;border-bottom:' + (last ? '0' : '1px solid #e3e3e3') + ';color:' + BLUE + ';font-weight:bold;">' + label + '</td>' +
          '<td style="padding:9px 12px;border-bottom:' + (last ? '0' : '1px solid #e3e3e3') + ';">' + value + '</td></tr>';
      }
      var table = '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#f9f9f9;border-left:4px solid ' + BLUE + ';margin:18px 0;width:100%;max-width:560px;font-size:14px;">' +
        row('Total Signups', plain('signups', '#')) +
        row('Live Attendance', plain('liveAtt', '#')) +
        row('On-Demand / Watch Later', plain('onDemand', '#')) +
        row('Member vs. Non-Member', split) +
        row('Total Revenue Generated', plain('revenue', '$'), true) + '</table>';
      var hl = esc(val('highlights')).replace(/\n/g, '<br>');
      var body =
        '<p>Hi everyone,</p>' +
        '<p>I wanted to share a quick update and the analytics from our <strong>' + (t ? esc(t) : ph('Webinar Title')) + '</strong> webinar that took place ' + whenPast() + '.</p>' +
        '<p>Thanks to the new Speaker Docket tool Tara created, we can now easily track and break down our webinar metrics (and bypass some of our current YM reporting glitches!). Here is the snapshot of how the ' + (s ? esc(s) : ph('Short Name')) + ' webinar performed:</p>' +
        table +
        '<p>' + hl + '</p>' +
        '<p>I will continue sending these analytics reports to the board after our webinars. Please let me know if you have any questions!</p>';
      return {
        subject: 'Post-Webinar Analytics: ' + (s || '[Short Name]') + ' (' + (d ? numDate2(d) : '[Date]') + ')',
        recipients: 'To: Kara, Jenny, Tara  |  CC: Rachael',
        html: wrap(body, 'Best regards,')
      };
    },

    renewal: function () {
      var body =
        '<p>Hello,</p>' +
        '<p>This is a friendly reminder that your NACBA membership is currently due for renewal!</p>' +
        '<p>We greatly value your involvement in our community and would love to continue supporting you as a member.</p>' +
        '<p>Renewing your membership ensures uninterrupted access to NACBA\'s resources, educational programming, advocacy efforts, and exclusive member benefits.</p>' +
        '<p style="margin-bottom:0;">To renew, please visit <a href="http://www.nacba.org/" style="color:' + LINK + ';">NACBA.org</a> and sign in using your username and password. Once logged in, you will be prompted to complete your renewal.</p>' +
        button('Renew at NACBA.org', 'http://www.nacba.org/') +
        '<p>If you have any questions or need assistance, please don\'t hesitate to contact us. We are happy to help!</p>' +
        '<p>Thank you for your continued support of NACBA.</p>';
      return { subject: 'NACBA Membership Renewal Reminder', html: wrap(body, 'Best regards,') };
    },

    referral: function () {
      var body =
        '<p>Hello,</p>' +
        '<p>Thank you for contacting NACBA. We understand that navigating bankruptcy can feel overwhelming, and we want to make sure you get the support you need.</p>' +
        '<p style="margin-bottom:0;">While NACBA staff are not attorneys and are unable to provide legal advice, our Attorney Finder database can help you connect with a qualified consumer bankruptcy attorney in your area:</p>' +
        button('Find an Attorney', 'https://nacba.org/page/find-an-attorney') +
        '<p>We hope this resource points you in the right direction. Please contact us if we can assist you further.</p>';
      return { subject: 'NACBA Attorney Referral', html: wrap(body, 'Best regards,') };
    }
  };

  var current = { subject: '', html: '' };

  function update() {
    var key = $('template').value, cfg = CONFIG[key];
    ALL.forEach(function (f) { $('f-' + f).style.display = cfg.show.indexOf(f) >= 0 ? '' : 'none'; });
    $('linkLabel').textContent = cfg.linkLabel;
    var l = val('link');
    $('linkWarn').hidden = !(cfg.show.indexOf('link') >= 0 && l && !isUrl(l));
    current = BUILDERS[key]();
    $('subjectLine').textContent = current.subject;
    $('recipBox').hidden = !current.recipients;
    $('recipLine').textContent = current.recipients || '';
    $('emailPreview').innerHTML = current.html;
  }

  var statusTimer;
  function say(msg) {
    $('status').textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { $('status').textContent = ''; }, 4000);
  }
  function selectionCopy(node) {
    var range = document.createRange();
    range.selectNodeContents(node);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    sel.removeAllRanges();
    return ok;
  }

  $('copyBtn').addEventListener('click', function () {
    var html = $('emailPreview').innerHTML, text = $('emailPreview').innerText;
    function fallback() {
      say(selectionCopy($('emailPreview')) ? 'Email copied. Paste it into Gmail.' : 'Copy blocked. Select the preview and copy manually.');
    }
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' })
      })]).then(function () { say('Email copied. Paste it into Gmail.'); }, fallback);
    } else { fallback(); }
  });

  $('copySubjectBtn').addEventListener('click', function () {
    var s = current.subject;
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      say(ok ? 'Subject copied.' : 'Copy blocked. Select the subject manually.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () { say('Subject copied.'); }, fallback);
    } else { fallback(); }
  });

  ['template', 'webinarTitle', 'speakers', 'greeting', 'livePT', 'shortName', 'dateVal', 'name', 'both', 'link', 'practice', 'live', 'dropbox', 'survey', 'cle',
   'signups', 'liveAtt', 'onDemand', 'revenue', 'members', 'nonMembers', 'highlights', 'logoPos'].forEach(function (id) {
    $(id).addEventListener('input', update);
    $(id).addEventListener('change', update);
  });

  update();
})();
</script>
</body>
</html>
